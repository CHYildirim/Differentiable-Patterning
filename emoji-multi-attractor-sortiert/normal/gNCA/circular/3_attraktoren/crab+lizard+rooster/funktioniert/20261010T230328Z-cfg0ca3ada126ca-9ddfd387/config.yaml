schema_version: 7
seed: 1470221169
experiment:
  name: emoji_multi_attractor_outsource
  stability_mode: null
system:
  precision: tensorfloat32
  gpu: null
  xla_flags: []
data:
  dataset: emojis
  batches: 2
  downsample: 1
  emoji:
    task: multi_attractor
    sequence:
    - alien_monster.png
    - microbe.png
    - rooster.png
    - rooster.png
    pairs:
    - initial:
        image: crab.png
        mode: patch
        size: 1
      target: crab.png
    - initial:
        image: rooster.png
        mode: patch
        size: 1
      target: rooster.png
    - initial:
        image: lizard.png
        mode: patch
        size: 1
      target: lizard.png
    target_repeats: 2
    timesteps: null
    observed_channels: 4
    data_channels: 4
    crop_square: false
    pad:
    - 10
    - 10
    - 10
    - 10
    shift_amount: 2
    noise_strength: 0.005
    noise_mode: full
    terminal_carry:
      enabled: false
      start_iteration: 1000
      schedule_iterations: 4000
      initial_probability: 0.5
      final_probability: 0.9
    regeneration:
      enabled: true
      start_iteration: 0
      schedule_iterations: 0
      initial_probability: 1.0
      final_probability: 1.0
  micropattern: null
  snowmelt: null
  pde: null
  knockout:
    mode: null
    time: null
    channel: null
    curriculum: null
model:
  family: gNCA
  channels: 64
  kernel_str:
  - ID
  - LAP
  - GRAD
  fire_rate: 0.5
  padding: CIRCULAR
  activation: relu
  kernel_scale: 1
  parameter_noise_level: 0.01
run:
  mode: train
  t: 128
  iterations: 16000
  checkpoint_warmup: 10
  write_images: true
  write_videos: true
  derive_t_from_fire_rate: false
  fire_rate_step_numerator: null
  repeat: 1
  interval_mode: uniform
  reference_interval: null
  interval_steps: null
trainer:
  boundary_mode: soft
  grad_loss: true
  log_directory: logs/
  loss_time_channel_mask: null
  loop_autodiff: lax
  log_every: 100
  validation_every: null
  validation_rollout: false
  jax_trace: false
  pool_admission:
    enabled: true
    relative_threshold: 1.25
    previous_relative_threshold: 1.1
    absolute_threshold: null
    ema_decay: 0.95
    warmup: 10
optimiser:
  type: nadam
  learn_rate: 0.001
  warmup_steps: 64
  decay_rate: 0.99
  blocknorm: true
  sam: false
  sam_rho: 0.05
  sam_sync_period: 2
  gradient_clip_norm: null
  apply_if_finite: false
  max_consecutive_errors: 8
  schedule:
    type: exponential
    warmup_init_lr: 1.0e-06
    final_factor: 0.1
    transition_fraction: 0.75
    decay_rate: null
loss:
  terms:
  - type: l2
    weight: 1.0
    channels: null
    experiment_groups: null
    schedule: null
  regularisers:
    intermediate_state: 1.0
    boundary: 0.0
    contiguous_growth: 1.0
    localised_hidden: 0.0
    update_sensitivity: 0.0
    perturbation_conservation: 0.0
    hidden_state_size: 0.0
  schedule_label: null
logging:
  backend: wandb
  wandb:
    project: NCA-emoji-multi-attractor
    group: emoji-multi-attractor-training-sweep-v1
    tags:
    - attractors:3
    tag_keys:
    - run.repeat
    - model.family
    - model.padding
    - data.emoji.pairs
    - data.batches
    - logging.wandb.tags
  singular_values:
    enabled: false
    plot_spectra: true
    epsilon: 1.0e-08
model_store:
  enabled: true
  root: /workspace/writeable/Models/
  collection: NCA-emoji
  model_factory: NCA.model.factory:build_model
initialization:
  model_id: null
labels:
  scaling: null
  gpu: null
