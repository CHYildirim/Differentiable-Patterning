experiment_name: cluster_test_v2
entrypoint: Experiments.emoji.train:run
output_subdir: generated/cluster_test
seed_mode: index
grid:
  run.repeat: [0,1,2,3,4]
  data.emoji.task: [multi_attractor]
  data.emoji.pairs:
    - - initial: {image: crab.png, mode: patch, size: 3}
        target: crab.png
      - initial: {image: microbe.png, mode: patch, size: 3}
        target: microbe.png
  data.emoji.target_repeats: [2]
  data.batches: [2]
  data.downsample: [0]
  logging.wandb.project: [NCA-emoji]
  logging.wandb.group: [cluster_test]
  model.family: [NCA]
  model.channels: [32]
  run.t: [64]
  run.iterations: [1000]
  trainer.loop_autodiff: [checkpointed,lax]
