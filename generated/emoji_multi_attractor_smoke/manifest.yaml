  config:
    schema_version: 1
    seed: 0
    experiment:
      name: emoji_multi_attractor_smoke
    system:
      precision: tensorfloat32
      gpu: null
      xla_flags: null
    data:
      dataset: emojis
      batches: 1
      downsample: 16
      emoji:
        task: multi_attractor
        sequence:
        - alien_monster.png
        - microbe.png
        - rooster.png
        - rooster.png
        pairs:
        - initial:
            image: crab.png
            mode: patch
            size: 4
          target: crab.png
        - initial:
            image: microbe.png
            mode: patch
            size: 4
          target: microbe.png
        target_repeats: 1
        timesteps: null
        observed_channels: 4
        data_channels: 4
        crop_square: false
