          enabled: true
          start_iteration: 0
          schedule_iterations: 0
          initial_probability: 1.0
          final_probability: 1.0
    model:
      family: NCA
      channels: 8
      kernel_str:
      - ID
      - LAP
      - GRAD
      activation: relu
      fire_rate: 0.5
      padding: REPLICATE
      kernel_scale: 1
      parameter_noise_level: 0.01
    trainer:
      boundary_mode: soft
      grad_loss: false
      sharding: null
      backend:
        type: none
      log_directory: logs/
