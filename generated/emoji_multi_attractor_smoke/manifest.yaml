      pool_admission_absolute_threshold: null
      pool_admission_ema_decay: 0.95
      pool_admission_warmup: null
    optimiser:
      type: nadam
      blocknorm: true
      sam: false
      gradient_clip_norm: null
      apply_if_finite: false
      max_consecutive_errors: 8
      learn_rate: 0.001
      warmup_steps: 10
      decay_rate: 0.99
      schedule:
        type: exponential
        warmup_init_lr: 1.0e-06
        final_factor: 0.1
        transition_fraction: 0.75
    loss:
      terms:
      - type: l2
        weight: 1.0
      regularisers:
        intermediate_state: 1.0
        boundary: 0.0
        contiguous_growth: 1.0
        localised_hidden: 0.0
        update_sensitivity: 0.0
        perturbation_conservation: 0.0
        hidden_state_size: 0.0
    run:
