      fire_rate_step_numerator: null
      iterations: 200
      warmup: 10
      write_images: true
      filename_mode: hydra
    logging:
      backend: wandb
      wandb:
        project: NCA-emoji
        group: emoji-multi-attractor-smoke
        tags: null
    model_store:
      enabled: true
      root: models
      collection: NCA-emoji
      model_factory: Experiments.config_helpers:build_model
    knockout:
      time: null
      channel: null
